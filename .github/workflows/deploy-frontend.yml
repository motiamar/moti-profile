name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # Add VITE_API_BASE_URL as a GitHub Actions secret:
          # Repo → Settings → Secrets and variables → Actions → New repository secret
          # Name:  VITE_API_BASE_URL
          # Value: https://your-backend.onrender.com
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

          # If your repo is username/LinkdinBot (project page), uncomment and set:
          # VITE_BASE_PATH: /LinkdinBot/
          # Then also update vite.config.js: base: process.env.VITE_BASE_PATH || '/'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
